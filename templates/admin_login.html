<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
<style>
  input {
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: Poppins, Arial;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: #0d1bd1;
    box-shadow: 0 0 0 3px rgba(13,27,209,0.1);
  }

  input.error {
    border-color: #dc3545;
    box-shadow: 0 0 0 3px rgba(220,53,69,0.1);
  }

  .main-btn {
    border-radius: 6px;
    font-family: Poppins, Arial;
    font-size: 0.95rem;
    font-weight: 600;
    transition: background 0.2s, transform 0.1s;
  }

  .main-btn:hover  { background: #0a14a8; }
  .main-btn:active { transform: scale(0.98); }
  .main-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .container h2 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #0d1bd1;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #777;
    margin-bottom: 18px;
  }

  .badge {
    display: inline-block;
    background: rgba(13,27,209,0.08);
    color: #0d1bd1;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(13,27,209,0.15);
  }

  .field { text-align: left; margin-bottom: 4px; }

  .field label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #444;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .error-msg {
    font-size: 0.78rem;
    color: #dc3545;
    margin: 3px 0 8px;
    display: none;
    text-align: left;
  }

  .error-msg.show { display: block; }

  .alert-box {
    background: #fff3f3;
    border: 1px solid #f5c2c7;
    color: #dc3545;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-bottom: 12px;
    text-align: left;
    display: none;
  }

  .alert-box.show { display: block; }
</style>
</head>
<body>

<div class="container">
  <div class="badge">🔒 Restricted Access</div>
  <h2>Admin Login</h2>
  <p class="subtitle">Enter your credentials to continue.</p>

  <div class="alert-box" id="alertBox"></div>

  <form id="adminLoginForm" novalidate>
    <div class="field">
      <label for="admin_id">Admin Name</label>
      <input type="text" id="admin_id" placeholder="Enter your name" required autocomplete="off">
      <div class="error-msg" id="nameError">Letters and spaces only (3–30 chars). No emails allowed.</div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
      <div class="error-msg" id="passError">Password must be at least 6 characters.</div>
    </div>

    <button type="submit" class="main-btn" id="loginBtn">Login</button>
  </form>
</div>

<script src="{{ url_for('static', filename='js/admin_login.js') }}"></script>
</body>
</html>
